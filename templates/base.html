<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>상담일지 관리</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <h1 class="logo"><a href="{{ url_for('index') }}">고등학교 상담일지 관리</a></h1>
      <nav class="top-nav">
        <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="{{ url_for('index') }}">홈</a>
        <a class="nav-link {% if request.path.startswith('/students') %}active{% endif %}" href="{{ url_for('students') }}">학생관리</a>
        <a class="nav-link {% if request.path.startswith('/logs') and not request.path.startswith('/logs/new') %}active{% endif %}" href="{{ url_for('logs_list') }}">상담일지 확인</a>
        <a class="nav-link {% if request.path.startswith('/logs/new') %}active{% endif %}" href="{{ url_for('new_log') }}">상담일지 작성</a>
        <a class="nav-link {% if request.path.startswith('/schedule') %}active{% endif %}" href="{{ url_for('schedule') }}">상담 일정</a>
        <a class="nav-link {% if request.path.startswith('/absence') %}active{% endif %}" href="{{ url_for('absence_tracker') }}">미인정결석 관리</a>
        <a class="nav-link {% if request.path.startswith('/stats') %}active{% endif %}" href="{{ url_for('stats') }}">상담 통계</a>
        <a class="nav-link {% if request.path.startswith('/settings/counsel-types') %}active{% endif %}" href="{{ url_for('counsel_types_settings') }}">상담유형</a>
        <a class="nav-link {% if request.path.startswith('/settings/school') %}active{% endif %}" href="{{ url_for('school_settings') }}">학교 설정</a>
        <a class="nav-link {% if request.path.startswith('/settings/ai') %}active{% endif %}" href="{{ url_for('ai_settings') }}">AI 설정</a>
      </nav>
    </div>
  </header>

  <main>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <ul class="flashes">
          {% for message in messages %}
            <li>{{ message }}</li>
          {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>
</body>
</html>
