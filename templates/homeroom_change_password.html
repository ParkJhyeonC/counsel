{% extends "homeroom_base.html" %}
{% block content %}
<section class="card">
  <h2>담임교사 비밀번호 변경</h2>
  <p class="muted">{{ teacher_name }} 선생님의 비밀번호를 변경합니다. 최초 접속 시에는 초기 비밀번호 <strong>1234</strong>를 현재 비밀번호로 입력하세요.</p>
  <form method="post" class="grid-form">
    <label>현재 비밀번호
      <input type="password" name="current_password" required>
    </label>
    <label>새 비밀번호
      <input type="password" name="new_password" minlength="4" required>
    </label>
    <label>새 비밀번호 확인
      <input type="password" name="new_password_confirm" minlength="4" required>
    </label>
    <button class="btn" type="submit">비밀번호 저장</button>
  </form>
</section>
{% endblock %}
