{% extends "homeroom_base.html" %}
{% block content %}
<section class="card">
  <h2>담임교사 로그인</h2>
  <p class="muted">담임교사 이름과 비밀번호를 입력하세요. 최초 비밀번호는 <strong>1234</strong>이며, 처음 접속하면 즉시 변경해야 합니다.</p>
  <form method="post" class="grid-form">
    <label class="full">담임교사 이름
      <input name="teacher_name" required autofocus placeholder="예: 홍길동">
    </label>
    <label class="full">비밀번호
      <input type="password" name="password" required>
    </label>
    <div class="button-row">
      <button class="btn" type="submit">접속</button>
      <a class="btn btn-secondary" href="{{ url_for('unlock_screen') }}">상담교사 잠금화면으로</a>
    </div>
  </form>
</section>
{% endblock %}
