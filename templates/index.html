{% extends "base.html" %}
{% block content %}
<section class="card">
  <h2>빠른 메뉴</h2>
  <p>학생 등록 후 상담일지를 작성할 수 있습니다.</p>
  <div class="button-row">
    <a class="btn" href="{{ url_for('students') }}">학생 등록/조회</a>
    <a class="btn" href="{{ url_for('new_log') }}">상담일지 작성</a>
  </div>
</section>

<section class="card">
  <h2>최근 상담일지</h2>
  <table>
    <thead><tr><th>상담일</th><th>학생</th><th>유형</th><th>요약</th></tr></thead>
    <tbody>
      {% for row in latest_logs %}
      <tr>
        <td>{{ row.date }}</td>
        <td>{{ row.student_name }}</td>
        <td>{{ row.type }}</td>
        <td>{{ row.summary }}</td>
      </tr>
      {% else %}
      <tr><td colspan="4">아직 상담일지가 없습니다.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</section>
{% endblock %}
