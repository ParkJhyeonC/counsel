{% extends "base.html" %}
{% block content %}
<section class="card">
  <h2>상담일지 작성</h2>
  <form method="post" enctype="multipart/form-data" class="grid-form">
    <label>학생
      <select name="student_id" required>
        <option value="">선택하세요</option>
        {% for s in students %}
        <option value="{{ s.id }}">{{ s.class_name }} {{ s.name }} ({{ s.student_no }})</option>
        {% endfor %}
      </select>
    </label>
    <label>상담일 <input type="date" name="date" required></label>
    <label>상담유형
      <select name="type" required>
        <option>진로</option><option>학업</option><option>정서</option><option>생활지도</option><option>기타</option>
      </select>
    </label>
    <label class="full">상담요약 <input name="summary" required></label>
    <label class="full">상담내용 <textarea name="detail" rows="4"></textarea></label>
    <label class="full">조치사항/추후계획 <textarea name="action_plan" rows="3"></textarea></label>
    <label>다음 상담일 <input type="date" name="next_date"></label>
    <label>첨부파일 <input type="file" name="attachments" multiple></label>
    <button class="btn" type="submit">상담일지 저장</button>
  </form>
</section>
{% endblock %}
