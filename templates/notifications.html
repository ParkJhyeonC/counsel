{% extends "base.html" %}
{% block content %}
<section class="card">
  <h2>알림</h2>
  <p class="muted">상담신청 도착 알림을 확인하고 클릭하면 일정 등록 화면으로 이동합니다.</p>
  <table>
    <thead><tr><th>시각</th><th>내용</th><th>상태</th><th>열기</th></tr></thead>
    <tbody>
      {% for n in notifications %}
      <tr>
        <td>{{ n.created_at }}</td>
        <td>{{ n.message }}</td>
        <td>{% if n.is_read %}읽음{% else %}<strong>미읽음</strong>{% endif %}</td>
        <td><a class="btn btn-secondary" href="{{ url_for('open_notification', notification_id=n.id) }}">열기</a></td>
      </tr>
      {% else %}
      <tr><td colspan="4">알림이 없습니다.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</section>
{% endblock %}
