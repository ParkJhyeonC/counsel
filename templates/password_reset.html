<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>암호 재설정</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="icon" href="{{ url_for('favicon') }}">
</head>
<body>
  <main style="max-width: 560px; margin-top: 3rem;">
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <ul class="flashes">
          {% for message in messages %}<li>{{ message }}</li>{% endfor %}
        </ul>
      {% endif %}
    {% endwith %}

    <section class="card">
      <h2>암호 재설정</h2>
      <p class="muted">처음 설정한 히든 넘버(전화번호)가 일치하면 암호를 재설정할 수 있습니다.</p>
      <form method="post" class="grid-form">
        <label class="full">히든 넘버(전화번호)
          <input name="reset_phone" placeholder="예: 01012345678" required>
        </label>
        <label class="full">새 암호
          <input type="password" name="password" minlength="4" required>
        </label>
        <label class="full">새 암호 확인
          <input type="password" name="password_confirm" minlength="4" required>
        </label>
        <div class="button-row">
          <button class="btn" type="submit">재설정</button>
          <a class="btn btn-secondary" href="{{ url_for('unlock_screen') }}">잠금 화면으로</a>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
