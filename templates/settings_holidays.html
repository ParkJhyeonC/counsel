{% extends "base.html" %}
{% block content %}
<section class="card">
  <h2>임시공휴일 설정</h2>
  <p class="muted">대한민국 공휴일은 자동 반영되며, 여기서는 임시공휴일만 추가/삭제합니다. 자동 반영 공휴일 수: {{ auto_holiday_count }}일</p>

  <form method="post" class="search-form">
    <input type="hidden" name="action" value="add_holiday">
    <label>임시공휴일 <input type="date" name="holiday_date" required></label>
    <label>이름 <input name="holiday_name" placeholder="예: 임시공휴일"></label>
    <button class="btn" type="submit">저장</button>
  </form>

  <div class="button-row" style="margin-top:.65rem;">
    {% for h in temp_holiday_rows %}
    <form method="post" class="inline-form">
      <input type="hidden" name="action" value="delete_holiday">
      <input type="hidden" name="holiday_date" value="{{ h.holiday_date }}">
      <button type="submit" class="btn btn-secondary">{{ h.holiday_date }} {{ h.name or '임시공휴일' }} 삭제</button>
    </form>
    {% else %}
    <p class="muted">등록된 임시공휴일이 없습니다.</p>
    {% endfor %}
  </div>
</section>
{% endblock %}
