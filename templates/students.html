{% extends "base.html" %}
{% block content %}
<section class="card">
  <h2>학생 등록</h2>
  <form method="post" class="grid-form">
    <label>학번 <input name="student_no" required></label>
    <label>이름 <input name="name" required></label>
    <label>반 <input name="class_name"></label>
    <label>연락처 <input name="phone"></label>
    <label>보호자 연락처 <input name="guardian_phone"></label>
    <label class="full">비고 <textarea name="note" rows="2"></textarea></label>
    <button class="btn" type="submit">저장</button>
  </form>
</section>

<section class="card">
  <h2>학생 조회</h2>
  <form method="get" class="search-form">
    <input name="q" value="{{ q }}" placeholder="학번/이름/반 검색">
    <button class="btn" type="submit">검색</button>
  </form>

  <table>
    <thead><tr><th>학번</th><th>이름</th><th>반</th><th>상세</th></tr></thead>
    <tbody>
      {% for s in students %}
      <tr>
        <td>{{ s.student_no }}</td>
        <td>{{ s.name }}</td>
        <td>{{ s.class_name }}</td>
        <td><a href="{{ url_for('student_detail', student_id=s.id) }}">이력 보기</a></td>
      </tr>
      {% else %}
      <tr><td colspan="4">등록된 학생이 없습니다.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</section>
{% endblock %}
